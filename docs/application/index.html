\",\"$L38\",null,{\"href\":\"/\",\"children\":\"← Вернуться на сайт\"},\"$34\",\"$37\",1],[\"$\",\"span\",null,{\"children\":\"Твоя служба / анкета\"},\"$34\",\"$39\",1]]},\"$34\",\"$36\",1],[\"$\",\"$L3b\",null,{\"pages\":[{\"slug\":\"social-benefits\",\"navLabel\":\"Социальные льготы\",\"kicker\":\"Поддержка участников и семей\",\"title\":\"Социальные льготы\",\"lead\":\"Собрали основные направления поддержки, чтобы было проще найти нужную меру и уточнить порядок обращения.\",\"sections\":[{\"id\":\"payments\",\"title\":\"Выплаты и компенсации\",\"body\":\"Система поддержки включает денежное довольствие, единовременные и дополнительные выплаты, а также компенсации отдельных расходов. Конкретный размер зависит от статуса, периода службы, выполняемых задач и действующих федеральных или региональных правил.\"},{\"id\":\"family\",\"title\":\"Поддержка семьи\",\"body\":\"Для детей, супругов и родителей предусмотрены отдельные меры: помощь с образованием, отдыхом, социальным сопровождением и оформлением документов. Набор льгот различается по регионам и жизненной ситуации семьи.\"},{\"id\":\"housing\",\"title\":\"Жильё и военная ипотека\",\"body\":\"Жилищная поддержка может включать служебное жильё, компенсацию найма и участие в накопительно-ипотечной системе. Право, сроки вступления и порядок использования средств необходимо подтверждать индивидуально.\"},{\"id\":\"credits\",\"title\":\"Кредитные обязательства\",\"body\":\"Для отдельных категорий предусмотрены кредитные каникулы, приостановление взысканий и специальные основания прекращения обязательств. Решение принимается банком или уполномоченным органом после проверки документов.\"},{\"id\":\"leave\",\"title\":\"Отпуск и сохранение стажа\",\"body\":\"Порядок предоставления отпуска, время на проезд и учёт отдельных периодов службы определяются законодательством и условиями прохождения службы. Конкретные даты согласуются с командованием подразделения.\"},{\"id\":\"health\",\"title\":\"Здоровье и реабилитация\",\"body\":\"Военнослужащим доступны медицинское обследование, лечение, обеспечение назначенными лекарствами, реабилитация и государственное страхование. Объём помощи определяется медицинскими показаниями и установленным порядком.\"},{\"id\":\"education\",\"title\":\"Образование и трудоустройство\",\"body\":\"Участникам и членам семей доступны отдельные образовательные льготы, профессиональная подготовка и содействие занятости. Для детей могут действовать специальные условия при поступлении и организации отдыха.\"},{\"id\":\"veterans\",\"title\":\"Статус ветерана боевых действий\",\"body\":\"Удостоверение ветерана открывает доступ к предусмотренным законом выплатам, налоговым, жилищным и другим мерам поддержки. Основание и порядок оформления подтверждаются через командование и уполномоченные органы.\"}],\"image\":{\"day\":\"/bg-social-benefits-day.webp\",\"night\":\"/bg-social-benefits-night.webp\",\"position\":\"center center\"}},{\"slug\":\"svo\",\"navLabel\":\"СВО\",\"kicker\":\"Контрактная служба\",\"title\":\"Служба по контракту\",\"lead\":\"Выберите направление, узнайте условия и оставьте заявку на консультацию.\",\"sections\":[{\"id\":\"directions\",\"title\":\"Направления службы\",\"body\":\"Городские задачи, фронтовые направления и защита объектов. Подходящее направление уточняется на консультации с учетом опыта и подготовки кандидата.\"},{\"id\":\"selection\",\"title\":\"Отбор кандидатов\",\"body\":\"На первом этапе принимаются документы, проводится собеседование и медицинский осмотр. Специалист уточняет профессиональные навыки, состояние документов и предпочтительное направление службы.\"},{\"id\":\"support\",\"title\":\"Подготовка и сопровождение\",\"body\":\"После оформления кандидат получает предписание и направляется к месту подготовки. Продолжительность обучения зависит от специальности; итоговые условия и порядок дальнейшей службы подтверждаются до заключения контракта.\"},{\"id\":\"documents\",\"title\":\"Документы для оформления\",\"body\":\"Базовый комплект включает паспорт, анкету, автобиографию и документы об образовании. При наличии также подготавливаются военный билет, водительское удостоверение и документы о составе семьи. Точный перечень необходимо уточнить перед прибытием.\"},{\"id\":\"steps\",\"title\":\"Основные этапы\",\"body\":\"Маршрут кандидата состоит из подачи документов, профессионального собеседования, медицинского освидетельствования, оформления контракта и направления к месту подготовки или службы.\"}],\"image\":{\"day\":\"/bg-svo-day.webp\",\"night\":\"/bg-svo-night.webp\",\"position\":\"center center\"}},{\"slug\":\"africa\",\"navLabel\":\"Африканский корпус\",\"kicker\":\"Международное направление\",\"title\":\"Африканский корпус\",\"lead\":\"Контрактная служба для кандидатов с военной, технической и обеспечивающей подготовкой.\",\"sections\":[{\"id\":\"roles\",\"title\":\"Кого рассматривают\",\"body\":\"Боевые подразделения, технические специалисты, водители, специалисты связи, медицины и обеспечения. Конкретная должность зависит от отбора.\"},{\"id\":\"conditions\",\"title\":\"Условия направления\",\"body\":\"Срок, место службы, обеспечение и порядок оформления обсуждаются с кандидатом до принятия решения. Данные на сайте носят справочный характер.\"},{\"id\":\"consultation\",\"title\":\"Как получить консультацию\",\"body\":\"Оставьте контактные данные и укажите интересующее направление. Специалист свяжется с вами и ответит на вопросы по этапам оформления.\"}],\"image\":{\"day\":\"/bg-africa-day.webp\",\"night\":\"/bg-africa-night.webp\",\"position\":\"center center\"}},{\"slug\":\"territorial\",\"navLabel\":\"Тероборона\",\"kicker\":\"Безопасность территорий\",\"title\":\"Территориальная оборона\",\"lead\":\"Подготовленный резерв, защита объектов и служба в составе слаженного подразделения.\",\"sections\":[{\"id\":\"tasks\",\"title\":\"Задачи подразделений\",\"body\":\"Охрана важных объектов, наблюдение, связь и обеспечение устойчивой работы подразделения. Задачи зависят от места службы и должности.\"},{\"id\":\"experience\",\"title\":\"Навыки кандидата\",\"body\":\"Учитываются военная подготовка, техническая специальность, водительский опыт, медицинские навыки и готовность работать в команде.\"},{\"id\":\"process\",\"title\":\"Порядок оформления\",\"body\":\"После заявки проходит консультация, проверка документов и подбор подходящей должности. Итоговые условия фиксируются в документах.\"}],\"image\":{\"day\":\"/bg-territorial-day.webp\",\"night\":\"/bg-territorial-night.webp\",\"position\":\"center center\"}},{\"slug\":\"bpls\",\"navLabel\":\"БПЛС\",\"kicker\":\"Беспилотные системы\",\"title\":\"Беспилотные системы\",\"lead\":\"Техническое направление для операторов, инженеров и специалистов обеспечения.\",\"sections\":[{\"id\":\"specialties\",\"title\":\"Специальности\",\"body\":\"Операторы, техники, инструкторы и специалисты контрактного центра. Требования различаются в зависимости от выбранной должности.\"},{\"id\":\"training\",\"title\":\"Предварительное обучение\",\"body\":\"Подготовка помогает оценить способности кандидата, освоить базовые навыки и понять требования к работе с беспилотными системами.\"},{\"id\":\"application\",\"title\":\"Заявка на направление\",\"body\":\"Укажите контактные данные и интересующую специальность. Специалист уточнит опыт, доступные программы и дальнейшие шаги.\"}],\"image\":{\"day\":\"/bg-bpls-day.webp\",\"night\":\"/bg-bpls-night.webp\",\"position\":\"center center\"}}],\"initialService\":\"\"},\"$34\",\"$3a\",1]]},\"$34\",\"$35\",1]\n")</script><script>Object.assign(((self[Symbol.for("vinext.navigationRuntime")]??={bootstrap:{routeManifest:null},functions:{}}).bootstrap.rsc??={rsc:[]}),{"initialCacheKind":"dynamic"});((self[Symbol.for("vinext.navigationRuntime")]??={bootstrap:{routeManifest:null},functions:{}}).bootstrap.rsc??={rsc:[]}).done=true</script><script defer src="/static-runtime.js"></script></body></html>
